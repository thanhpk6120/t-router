services:
  t-router:
    build: .
    image: t-router:latest
    container_name: t-router
    restart: always
    ports:
      - "20126:20126"
    volumes:
      - t-router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20126"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  t-router-data:
    name: t-router-data
